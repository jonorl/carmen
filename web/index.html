<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where in the World?</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0f1626; overflow: hidden; }
    /* The game scales its layout to fit whatever size this canvas is. On
       phones 100vh counts the space behind the address bar too, which hid the
       buttons; dvh is only what's visible (100vh is for older browsers). */
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
    /* Shown while the game downloads, in the game's own black and white. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: #000; color: #fff; font: 18px monospace;
    }
    #loading .bar { width: min(320px, 80vw); height: 16px; border: 3px double #fff; padding: 2px; }
    #loading .fill { width: 0; height: 100%; background: #fff; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading"><div>WHERE IN THE WORLD?</div><div class="bar"><div class="fill"></div></div><div class="status">Loading…</div></div>
  <script src="mq_js_bundle.js"></script>
  <script src="storage.js"></script>
  <script src="input.js"></script>
  <script src="net.js"></script>
  <script>
    // Download the game ourselves to show progress, then hand it to
    // macroquad's loader. build-web.sh writes in the file's real size, since
    // a compressing web host's Content-Length is the compressed one.
    (async function () {
      const total = Number("__WASM_BYTES__") || 0;
      const overlay = document.getElementById("loading");
      const fill = overlay.querySelector(".fill");
      const status = overlay.querySelector(".status");
      let source = "carmen.wasm";
      try {
        const response = await fetch(source);
        const reader = response.body.getReader();
        const chunks = [];
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got += value.length;
          if (total) {
            const percent = Math.min(100, Math.round((got * 100) / total));
            fill.style.width = percent + "%";
            status.textContent = "Loading… " + percent + "%";
          } else {
            status.textContent = "Loading… " + (got / 1048576).toFixed(1) + " MB";
          }
        }
        source = URL.createObjectURL(new Blob(chunks, { type: "application/wasm" }));
      } catch (e) {
        // No streaming (very old browser): let the loader fetch it plainly.
      }
      fill.style.width = "100%";
      status.textContent = "Starting…";
      load(source);
      // The loader sets wasm_exports once the game is running.
      const started = setInterval(function () {
        if (typeof wasm_exports !== "undefined" && wasm_exports) {
          clearInterval(started);
          overlay.remove();
          document.getElementById("glcanvas").focus();
        }
      }, 50);
    })();
  </script>
</body>
</html>
