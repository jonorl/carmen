name: Build and Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # The whole repository is the context: the server shares a crate with the game.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/jonorl/carmen-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose -f ~/my-VPS/projects/docker-compose.yml pull carmen-api
            docker compose -f ~/my-VPS/projects/docker-compose.yml up -d carmen-api
