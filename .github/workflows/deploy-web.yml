name: Build and Deploy Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - '**.md'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The tests and the data check run the desktop build, which links against these.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      # A broken data file would otherwise only show when the game fails to start.
      - name: Test
        run: cargo test -p carmen -p carmen-shared

      - name: Check the data files
        run: cargo run -- --check

      - name: Build
        run: ./build-web.sh

      # Cloudflare's own Pages builds have no Rust, so the build is uploaded as it is.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=carmen --branch=main
